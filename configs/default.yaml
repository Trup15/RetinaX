seed: 42
device: "auto"

dr:
  arch: "efficientnet_b3"
  img_size: 384
  pretrained: true
  epochs: 25
  batch_size: 16
  lr: 2e-4
  weight_decay: 1e-4
  drop_rate: 0.3
  drop_path_rate: 0.2
  loss: "ce_sqrtw"
  warmup_epochs: 1
  grad_clip: 1.0
  early_stop_patience: 8
  primary_fold: 0
  num_classes: 5
  class_names: ["No DR", "Mild", "Moderate", "Severe", "Proliferative"]
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  clahe: false

quality:
  arch: "mobilenetv3_small_100"
  img_size: 320
  pretrained: true
  epochs: 15
  batch_size: 32
  lr: 1e-3
  weight_decay: 1e-4
  target_sensitivity: 0.95
  num_classes: 2
  class_names: ["gradable", "ungradable"]
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

mc:
  n_passes: 30
  enabled: true

referral:
  target_rate: 0.15
  method: "entropy"

xai:
  methods: ["grad_cam_pp", "score_cam", "integrated_gradients"]
  default_method: "grad_cam_pp"
  target_layer: "blocks[-1]"
  ig_steps: 32
  ig_batch_size: 8
  ig_baseline: "black"
  blur_sigma: 4.0
  binarization_thresholds: [0.25, 0.5, 0.75]
  binarization_fractions: [0.02, 0.05, 0.10, 0.20]
  pointing_tolerance_px: 0

data:
  data_root: "./data"
  smoke_root: "./smoke_data"
  metadata_dir: "./metadata"
  cache_dir: "./cache"
  artifacts_dir: "./artifacts"
  outputs_dir: "./outputs"
  seed: 42
  num_workers: 4
  pin_memory: true

deploy:
  onnx_opset: 17
  benchmark_runs: 50
  benchmark_warmup: 10
  threads: [1, 4]